name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"

jobs:
  build:
    # Must match the zmk revision pinned in config/west.yml — the @main
    # workflow gates on CONFIG_ZMK_BOARD_COMPAT, which Zephyr 3.5 boards
    # cannot set.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

