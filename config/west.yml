manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: gpeye
      url-base: https://github.com/GPeye
  projects:
    - name: eyelash_sofle
      url: https://github.com/a741725193/zmk-sofle
      revision: refactor
    - name: mario-peripheral-animation
      remote: gpeye
      revision: main 
    - name: zmk
      remote: zmkfirmware
      # Pinned: ZMK main moved to Zephyr 4.1, which dropped the legacy
      # boards/arm/<board>/ layout that boards/arm/eyelash_sofle still uses.
      # v0.3.0 is the last release on Zephyr 3.5. Unpinning requires migrating
      # the board to hardware model v2 first.
      revision: v0.3.0
      import: app/west.yml
  self:
    path: config
